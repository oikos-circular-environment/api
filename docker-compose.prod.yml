# Simulação de produção — calibrado para EC2 t3.small (2 vCPU, 2 GB RAM)
#
# Alocação de memória (~1.7 GB disponíveis após OS + Docker daemon):
#   postgresql  600 MB limit / 256 MB reservation
#   redis       128 MB limit /  64 MB reservation
#   minio       300 MB limit / 128 MB reservation
#   api         512 MB limit / 256 MB reservation
#
# Para rodar:
#   cp .env.prod.example .env.prod  # preencher variáveis
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Logs da aplicação ficam em ./logs/ (volume bind mount)

name: oikos-prod

services:
  postgresql:
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    env_file:
      - .env.prod
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_DATABASE_EXTENSIONS: postgis
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Tuning conservador para 600 MB de RAM
      POSTGRESQL_MAX_CONNECTIONS: "50"
      POSTGRESQL_SHARED_BUFFERS: "128MB"
      POSTGRESQL_WORK_MEM: "4MB"
      POSTGRESQL_EFFECTIVE_CACHE_SIZE: "384MB"
    volumes:
      - postgresql_data:/bitnami/postgresql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: bitnami/redis:latest
    env_file:
      - .env.prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # noeviction: BullMQ requer que jobs nunca sejam evictados silenciosamente
      # maxmemory limita uso; se atingido, Redis retorna erro (em vez de evictar)
      REDIS_EXTRA_FLAGS: "--maxmemory 96mb --maxmemory-policy noeviction"
    volumes:
      - redis_data:/bitnami/redis/data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    env_file:
      - .env.prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.5"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env.prod
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/oikos;
      mc anonymous set public local/oikos;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3333:3333"
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      LOG_LEVEL: info
      # Habilitar para capturar queries no logs/queries.log:
      # PRISMA_QUERY_LOG: "true"
    volumes:
      # Logs persistidos no host — acessíveis mesmo após restart do container
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.1
    profiles: ["obs"]
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/oikos:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    environment:
      LOKI_URL: ${LOKI_URL}
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

volumes:
  postgresql_data:
  redis_data:
  minio_data:

networks:
  default: {}
