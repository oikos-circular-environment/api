# Dois modos, via profiles do Compose:
#   dev        — loop de desenvolvimento normal, hot-reload (padrão)
#                docker compose -f docker-compose.dev.yml --profile dev up
#   simulation — aproxima comportamento de produção: build imutável, sem hot-reload,
#                NODE_ENV=production, limites de memória iguais aos de produção.
#                Não é a imagem real de deploy (essa vive em devops/docker/Dockerfile.api.prod).
#                Migration não roda sozinha — rodar antes do up:
#                docker compose -f docker-compose.dev.yml --profile simulation run --rm api-sim npx prisma migrate deploy
#                docker compose -f docker-compose.dev.yml --profile simulation up

name: oikos-dev

services:
  postgresql:
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRESQL_DATABASE: ${POSTGRES_DB}
      POSTGRESQL_DATABASE_EXTENSIONS: postgis
      POSTGRESQL_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: bitnami/redis:latest
    ports:
      - "6379:6379"
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb --ignore-existing local/oikos;
      mc anonymous set public local/oikos;
      exit 0;
      "

  api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: dev
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
    command: sh /app/docker/api-entrypoint.sh
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  api-sim:
    profiles: ["simulation"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: simulation
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  redis_data:
  minio_data:
