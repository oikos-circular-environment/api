services:
  postgresql:
    image: bitnami/postgresql:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRESQL_USERNAME: oikos_test
      POSTGRESQL_PASSWORD: oikos_test
      POSTGRESQL_DATABASE: oikos_test
      POSTGRESQL_DATABASE_EXTENSIONS: postgis
      POSTGRESQL_POSTGRES_PASSWORD: oikos_test
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oikos_test", "-d", "oikos_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: bitnami/redis:latest
    ports:
      - "6380:6379"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: oikos_test
      MINIO_ROOT_PASSWORD: oikos_test
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 oikos_test oikos_test;
      mc mb --ignore-existing local/oikos-test;
      mc anonymous set public local/oikos-test;
      exit 0;
      "
